name: Test site code

on:
  push:
    branches: [main]
    paths: ["assets/**", "tests/**", ".github/workflows/test.yml"]
  pull_request:
    paths: ["assets/**", "tests/**", ".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: node --check assets/app.js && node --check assets/zip.js
      - name: Run tests
        run: node --test tests/*.test.mjs
